<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chris13.com</title>
    <style>
        /* Reset defaults and take up full screen height */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #212529;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Stacks content vertically */
            justify-content: space-between; /* Pushes the footer to the very bottom */
            align-items: center;
            padding: 20px;
        }

        /* Empty top spacer to perfectly counter-balance the footer */
        .spacer {
            height: 60px; 
        }

        /* Center Domain Name */
        .main-content {
            text-align: center;
        }

        .domain-name {
            font-size: clamp(2.5rem, 6vw, 4.5rem); /* Dynamically scales with screen size */
            font-weight: 700;
            letter-spacing: -1px;
            color: #1a252f;
            margin-bottom: 10px;
        }

        .status-tag {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #95a5a6;
            font-weight: 600;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
            line-height: 1.6;
            min-height: 60px; /* Matches the top spacer for exact vertical centering */
        }

        .footer a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="spacer"></div>

    <main class="main-content">
        <h1 class="domain-name">chris13.com</h1>
        <p class="status-tag"></p>
    </main>

    <footer class="footer">
        <p>&copy; 2026 chris13.com. All Rights Reserved.</p>
        <p>Inquiries: <a href="mailto:hello@chris13.com">hello@chris13.com</a></p>
    </footer>

</body>
</html>
